[[mods]]
modId="bpnotify"
version="1.0.0"
displayName="Backpack Pickup Notify"
description='''
Makes items that go straight into a Sophisticated Backpack (magnet / pickup upgrade)
show up in Loot Journal, by sending the vanilla "item taken" packet from the server.
Remove this jar at any time to go back to the original behaviour.
'''

[[dependencies.bpnotify]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="BOTH"

[[dependencies.bpnotify]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1,1.21)"
ordering="NONE"
side="BOTH"

[[dependencies.bpnotify]]
modId="sophisticatedcore"
mandatory=false
versionRange="[1.3,)"
ordering="AFTER"
side="BOTH"
